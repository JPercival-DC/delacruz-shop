spring.application.name=shop

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# React dev server origin allowed to call the API. Override via env var
# if your frontend runs on a different port/host.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Below this remaining stock (after a successful reserve), InventoryService
# publishes a LowStockEvent. The supplier module's auto-reorder rule
# listens for it and places a real purchase order with LegacySupply.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# --- LegacySupply (edu.cit.delacruz.supplier) ---
app.supplier.base-url=https://legacysupply.onrender.com/api/v1
app.supplier.client-id=${LS_CLIENT_ID}
app.supplier.api-key=${LS_API_KEY}
app.supplier.timeout-ms=3000

# A reorder brings stock up to roughly this many units (see
# AutoReorderListener.onLowStock: unitsNeeded = target - remainingStock).
app.supplier.reorder-target=30

# product_id:SupplierSku:PackSize, from INTEGRATION.md's Part B table.
app.supplier.items=P100:BHD-1152:10,P200:BHD-5972:6,P300:BHD-5397:12

# How often the two background jobs run. No published request quota, so
# these default conservatively - turn them down if you start seeing
# E-RATE-03, or up once you know your real limit.
app.supplier.send-interval-ms=15000
app.supplier.poll-interval-ms=30000
app.supplier.batch-size=5

# One thread is enough for two @Scheduled methods that never overlap
# themselves, and keeps the sender and tracker from racing the same row.
spring.task.scheduling.pool.size=1
