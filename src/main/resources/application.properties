spring.application.name=shop

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# React dev server origin allowed to call the API. Override via env var
# if your frontend runs on a different port/host.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Below this remaining stock (after a successful reserve), InventoryService
# publishes a LowStockEvent for the Notification module to log as a
# "reorder needed" entry.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
